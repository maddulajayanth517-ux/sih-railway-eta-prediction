name: SIH Railway ETA Platform CI

on:
  push:
    branches:
      - main
      - development
      - feature/**
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  backend-api:
    name: Backend API CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend-api/requirements.txt

      - name: Install backend dependencies
        working-directory: backend-api
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Validate Python syntax
        working-directory: backend-api
        run: |
          python -m compileall -q .

      - name: Run backend tests
        working-directory: backend-api
        run: |
          if [ -d "tests" ]; then
            python -m pytest -v
          else
            echo "No tests directory found. Skipping tests."
          fi

  data-simulator:
    name: Data Simulator CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: data-simulator/requirements.txt

      - name: Install simulator dependencies
        working-directory: data-simulator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: data-simulator
        run: |
          python -m compileall -q .

      - name: Check mock GPS simulator
        working-directory: data-simulator
        run: |
          python -m py_compile generate_mock_gps.py